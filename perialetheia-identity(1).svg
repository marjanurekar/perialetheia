<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 706" width="900" height="706" role="img" aria-label="Perialetheia visual identity: mark construction, colour palette, and the ring rule">
  <defs>
    <style>
      .paper{fill:#F7F7F5}
      .navy{fill:#1A2E4A}
      .steel{fill:#2E5C8A}
      .teal{fill:#0F6E56}
      .amber{fill:#A8760F}
      .ink{fill:#14161A}
      .rule{stroke:#D9D8D2;stroke-width:1}
      .lbl{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:10.5px;letter-spacing:.09em;fill:#75736D;text-transform:uppercase}
      .cap{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:11px;fill:#5E5C57}
      .note{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px;fill:#3A3B3F}
      .wm{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:600;letter-spacing:.14em;fill:#1A2E4A}
      .sub{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.06em;fill:#2E5C8A}
    </style>

    <!-- THE MARK: value dot + coverage ring, solid where evaluated, dashed where not -->
    <g id="mark">
      <circle cx="50" cy="50" r="33" fill="none" stroke="#1A2E4A" stroke-width="7"
              stroke-linecap="round" stroke-dasharray="140 67" transform="rotate(-118 50 50)"/>
      <circle cx="50" cy="50" r="33" fill="none" stroke="#A8760F" stroke-width="7"
              stroke-linecap="round" stroke-dasharray="9 12" stroke-dashoffset="-142"
              transform="rotate(-118 50 50)"/>
      <circle cx="50" cy="50" r="9.5" fill="#1A2E4A"/>
    </g>
  </defs>

  <rect width="900" height="706" class="paper"/>

  <!-- header -->
  <text x="60" y="52" class="lbl">Visual identity · CWIAL No. 1</text>
  <line x1="60" y1="66" x2="840" y2="66" class="rule"/>

  <!-- ============ 01 · WHAT THE MARK SAYS ============ -->
  <text x="60" y="104" class="lbl">01 — What the mark says</text>
  <g transform="translate(88,126)">
    <use href="#mark" transform="scale(1.55)"/>
    <!-- annotation lines -->
    <line x1="78" y1="78" x2="215" y2="30" stroke="#2E5C8A" stroke-width="1"/>
    <circle cx="78" cy="78" r="2.5" class="steel"/>
    <text x="222" y="27" class="note" font-weight="600">The value</text>
    <text x="222" y="45" class="note" font-size="12.5">A measured quantity. One number.</text>

    <line x1="120" y1="30" x2="215" y2="96" stroke="#2E5C8A" stroke-width="1"/>
    <circle cx="120" cy="30" r="2.5" class="steel"/>
    <text x="222" y="93" class="note" font-weight="600">The solid arc — evaluated uncertainty</text>
    <text x="222" y="111" class="note" font-size="12.5">The interval we have characterised and can defend.</text>

    <line x1="26" y1="118" x2="215" y2="160" stroke="#A8760F" stroke-width="1"/>
    <circle cx="26" cy="118" r="2.5" class="amber"/>
    <text x="222" y="157" class="note" font-weight="600" fill="#A8760F">The dashed arc — not yet evaluated</text>
    <text x="222" y="175" class="note" font-size="12.5">The part of the interval we have not measured,</text>
    <text x="222" y="192" class="note" font-size="12.5">and therefore do not state. The ring never closes.</text>
  </g>
  <text x="88" y="344" class="note" font-style="italic" font-size="13.5">περί — around  ·  ἀλήθεια — unconcealment.  A measurement is not the truth; it is a bounded region around it.</text>

  <line x1="60" y1="370" x2="840" y2="370" class="rule"/>

  <!-- ============ 02 · PALETTE ============ -->
  <text x="60" y="408" class="lbl">02 — Palette</text>
  <g transform="translate(60,424)">
    <rect x="0" y="0" width="120" height="54" fill="#1A2E4A" rx="2"/>
    <text x="0" y="72" class="cap">Navy · #1A2E4A</text>
    <text x="0" y="88" class="cap" fill="#87857F">Primary. The value.</text>

    <rect x="146" y="0" width="120" height="54" fill="#2E5C8A" rx="2"/>
    <text x="146" y="72" class="cap">Steel · #2E5C8A</text>
    <text x="146" y="88" class="cap" fill="#87857F">Secondary, structure.</text>

    <rect x="292" y="0" width="120" height="54" fill="#0F6E56" rx="2"/>
    <text x="292" y="72" class="cap">Teal · #0F6E56</text>
    <text x="292" y="88" class="cap" fill="#87857F">Verified, measured.</text>

    <rect x="438" y="0" width="120" height="54" fill="#A8760F" rx="2"/>
    <text x="438" y="72" class="cap">Amber · #A8760F</text>
    <text x="438" y="88" class="cap" fill="#87857F">Pending, unevaluated.</text>

    <rect x="584" y="0" width="120" height="54" fill="#F7F7F5" rx="2" stroke="#D9D8D2"/>
    <text x="584" y="72" class="cap">Paper · #F7F7F5</text>
    <text x="584" y="88" class="cap" fill="#87857F">Ground.</text>

    <rect x="730" y="0" width="110" height="54" fill="#14161A" rx="2"/>
    <text x="730" y="72" class="cap">Ink · #14161A</text>
    <text x="730" y="88" class="cap" fill="#87857F">Text.</text>
  </g>

  <line x1="60" y1="554" x2="840" y2="554" class="rule"/>

  <!-- ============ 03 · THE RULE ============ -->
  <text x="60" y="592" class="lbl">03 — The rule</text>
  <g transform="translate(60,610)">
    <text x="0" y="14" class="note">The ring is never completed. A closed ring would claim a certainty the laboratory does not have.</text>
  </g>

  <line x1="60" y1="658" x2="840" y2="658" class="rule"/>
  <text x="60" y="682" class="cap" fill="#87857F">Perialetheia · Cognitive Warfare Information Analysis Laboratory No. 1</text>
</svg>
